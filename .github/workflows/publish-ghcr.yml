name: publish-ghcr

# Reusable workflow to build and push container images to GitHub Container Registry (ghcr.io).
# Can be called from any repository in the Scientific-Biotech-Specialties-Inc organization.

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Image name (e.g., auth-api, serms-web, ocr-api)'
        required: true
        type: string
      dockerfile:
        description: 'Dockerfile path'
        required: false
        default: 'Dockerfile'
        type: string
      context:
        description: 'Build context path'
        required: false
        default: '.'
        type: string
      tag:
        description: 'Image tag'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
