name: deploy-infra

# Deploys Azure infrastructure (ACR + Managed Environment + container apps).
# Runs manually or on push to main. Requires Azure secrets configured in the repo.
#
# Required repository secrets:
#   AZURE_CREDENTIALS  - JSON service principal with Contributor on the RG/subscription
#
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'infra/**', 'containers/**' ]

env:
  RG: rg-capstone
  LOCATION: eastus
  ENV: capstone-env
  ACR: capstoneacr0001
  IMAGE_TAG: latest

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: azure-infra
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          az group create -n ${{ env.RG }} -l ${{ env.LOCATION }} -o none
          az deployment group what-if -g ${{ env.RG }} \
            -f infra/main.bicep -p location=${{ env.LOCATION }} environmentName=${{ env.ENV }} acrName=${{ env.ACR }}

      - name: Deploy core (ACR + Managed Environment)
        run: |
          az deployment group create -g ${{ env.RG }} -n capstone-infra \
            -f infra/main.bicep \
            -p location=${{ env.LOCATION }} environmentName=${{ env.ENV }} acrName=${{ env.ACR }}

      # Note: container images are built & pushed to ACR by the three APP repos'
      # own deploy.yml (they have the source + Dockerfiles). Run those first, or
      # run scripts/deploy.ps1 locally, so images exist before this deploys apps.
      - name: Deploy container apps
        run: |
          az deployment group create -g ${{ env.RG }} -n capstone-apps \
            -f infra/apps.bicep \
            -p acrName=${{ env.ACR }} environmentName=${{ env.ENV }} location=${{ env.LOCATION }} \
               imageTag=$IMAGE_TAG minReplicas=1 \
               mysqlRootPassword="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
               postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
               jwtSecret="${{ secrets.JWT_SECRET }}" \
               internalEncryptionKey="${{ secrets.INTERNAL_ENCRYPTION_KEY }}" \
               sermsAppKey="${{ secrets.SERMS_APP_KEY }}" \
               authAppKey="${{ secrets.AUTH_APP_KEY }}" \
               supabaseAccessKey="${{ secrets.SUPABASE_ACCESS_KEY }}" \
               supabaseSecretKey="${{ secrets.SUPABASE_SECRET_KEY }}" \
               aiServiceApiKey="${{ secrets.AI_SERVICE_API_KEY }}" \
               prsApiKey="${{ secrets.PRS_API_KEY }}" \
               brevoApiKey="${{ secrets.BREVO_API_KEY }}" \
               mailPassword="${{ secrets.MAIL_PASSWORD }}"